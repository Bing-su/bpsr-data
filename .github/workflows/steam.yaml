name: Fetch Data

on:
  workflow_dispatch:

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: nu {0}
    steps:
      - name: Maximize build space
        uses: justinthelaw/maximize-github-runner-space@v0.10.0
        with:
          skip-components: dotnet
      - uses: actions/checkout@v7
      - uses: hustcer/setup-nu@v3

      - name: Install steamcmd
        run: |
          sudo apt update
          sudo apt install -y lib32gcc-s1 curl
          mkdir ~/steamcmd
          cd ~/steamcmd
          curl -sqL "https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz" | tar zxvf -
          echo $"($env.HOME)/steamcmd\n" | save -a $env.GITHUB_PATH
          df -h

      - uses: jdx/mise-action@v4

      - name: Install tools
        run: mise use -g github:Bing-su/bpsr-tool oxfmt

      - name: "Install Blue Protocol: Star Resonance"
        run: |
          steamcmd.sh +force_install_dir ./_bpsr +login anonymous +app_update 4113810 validate +quit

      - name: Extract Data
        run: |
          bpsr-tool --pkg ./_bpsr/StarSEA_STEAM_Data/StreamingAssets/container/meta.pkg --output ./src/data/korean --language korean

      - run: oxfmt

      - uses: EndBug/add-and-commit@v10
        with:
          add: "src/data"
          default_author: github_actions
          message: "data: update game data"
