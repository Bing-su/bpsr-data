name: Fetch Data

on:
  workflow_dispatch:

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: nu {0}
    steps:
      - name: Maximize build space
        uses: justinthelaw/maximize-github-runner-space@v0.10.0
        with:
          skip-components: dotnet
      - uses: actions/checkout@v7
      - uses: hustcer/setup-nu@v3

      - name: Install DepotDownloader
        run: |
          curl -LO https://github.com/SteamRE/DepotDownloader/releases/latest/download/DepotDownloader-linux-x64.zip
          unzip DepotDownloader-linux-x64.zip -d depotdownloader
          chmod +x depotdownloader/DepotDownloader
          echo "${{ github.workspace }}/depotdownloader\n" | save -a $env.GITHUB_PATH
          df -h
      - uses: jdx/mise-action@v4

      - name: Install tools
        run: mise use -g github:Bing-su/bpsr-tool oxfmt fd

      # 3681810: Global
      # 4073960: KR/JP
      # 4113810: HAOPLAY
      - name: "Install Blue Protocol: Star Resonance"
        run: |
          DepotDownloader -app 3681810 -depot 3681812 -os windows -dir ./_bpsr -validate

      - name: Extract Data
        run: |
          let meta = fd "meta.pkg$" ./_bpsr
          bpsr-tool --pkg $meta --output ./src/data/korean --language korean

      - run: oxfmt

      - uses: EndBug/add-and-commit@v10
        with:
          add: "src/data"
          default_author: github_actions
          message: "data: update game data"
