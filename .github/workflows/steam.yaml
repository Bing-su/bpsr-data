name: Fetch Data

on:
  workflow_dispatch:

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: nu {0}

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
      - uses: hustcer/setup-nu@v3
      - uses: jdx/mise-action@v4

      - name: Install tools
        run: mise use -g github:Bing-su/bpsr-tool oxfmt fd xh
        env:
          MISE_MINIMUM_RELEASE_AGE: "0s"

      # 3681810: Global
      # 4073960: KR/JP
      # 4113810: HAOPLAY
      - name: "Install Blue Protocol: Star Resonance"
        run: |
          xh -I -q -d ${{ secrets.DOWNLOAD_URL }} -o bpsr.zip
          unzip -o bpsr.zip -d ./_bpsr
      - name: Extract Data
        run: |
          let meta = fd "meta.pkg$" ./_bpsr
          let langs = [
            "english",
            "chinese",
            "japanese",
            "traditionalchinese",
            "korean",
            "thai",
            "indonesian",
            "german",
            "french",
            "spanish",
            "portuguese"
          ]
          for lang in $langs {
            bpsr-tool --pkg $meta --output $"./src/data/($lang)" --language $lang
            print $"::debug::Extracted ($lang) data"
          }

      - run: oxfmt

      - run: ls src/data

      - uses: EndBug/add-and-commit@v10
        with:
          add: "src/data"
          default_author: github_actions
          message: "data: update game data"
