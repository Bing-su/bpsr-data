name: Fetch Data

on:
  workflow_dispatch:

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: nu {0}

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
      - uses: hustcer/setup-nu@v3
      - uses: jdx/mise-action@v4

      - name: Install tools
        run: mise use -g github:Bing-su/bpsr-tool oxfmt fd xh
        env:
          MISE_MINIMUM_RELEASE_AGE: "0s"

      - name: "Install Blue Protocol: Star Resonance"
        run: |
          xh -I -q -d ${{ secrets.DOWNLOAD_URL }} -o bpsr.zip
          unzip -o bpsr.zip -d ./_bpsr

      - name: Remove old data
        run: rm -rf ./src/data

      - name: Extract Data
        run: |
          let meta = fd "meta.pkg$" ./_bpsr
          let langs = [
            "english",
            "chinese",
            "japanese",
            "traditionalchinese",
            "korean",
            "thai",
            "indonesian",
            "german",
            "french",
            "spanish",
            "portuguese"
          ]
          bpsr-tool il2cpp --pkg $meta --output ./_dll
          print "::debug::Extracted DLLs"
          for lang in $langs {
            bpsr-tool extract --pkg $meta --dll ./_dll --output $"./src/data/($lang)" --language $lang
            print $"::debug::Extracted ($lang) data"
          }

      - run: oxfmt
      - run: ls src/data

      - name: Get current date
        id: get-date
        run: |
          let now = date now | date to-timezone "Asia/Seoul" | format date "%Y-%m-%d"
          echo $"now=($now)\n" | save -a $env.GITHUB_OUTPUT

      - uses: EndBug/add-and-commit@v10
        with:
          add: "src/data"
          default_author: github_actions
          message: "data: update game data (${{ steps.get-date.outputs.now }})"
